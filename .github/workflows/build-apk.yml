name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java JDK
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Prepare Project Dependencies
        run: |
          if [ ! -f "package.json" ]; then
            npm init -y
          fi
          npm install @capacitor/core@latest @capacitor/cli@latest @capacitor/android@latest

      - name: Prepare Web Directory
        run: |
          mkdir -p www
          if [ -f "index.html" ]; then
            cp index.html www/
          fi
          if [ -d "assets" ]; then cp -r assets www/ 2>/dev/null || true; fi
          if [ -d "css" ]; then cp -r css www/ 2>/dev/null || true; fi
          if [ -d "js" ]; then cp -r js www/ 2>/dev/null || true; fi

      - name: Build Capacitor Android Project
        run: |
          npx cap init "AppleMapsClone" "com.apple.mapsclone" --web-dir "www" || true
          rm -rf android
          npx cap add android
          npx cap sync android

      - name: Build APK with Gradle
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
