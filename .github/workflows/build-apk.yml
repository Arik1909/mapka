name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java JDK
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Dependencies
        run: |
          npm install --force
          npm install -g @capacitor/cli

      - name: Build Web App
        run: |
          npm run build --if-present || true
          if [ ! -d "dist" ] && [ ! -d "build" ] && [ ! -d "www" ]; then
            mkdir www
            if [ -f "index.html" ]; then
              cp -r * www/ 2>/dev/null || true
            fi
          fi

      - name: Setup Capacitor and Android
        run: |
          WEB_DIR="dist"
          if [ -d "build" ]; then WEB_DIR="build"; fi
          if [ -d "www" ]; then WEB_DIR="www"; fi
          
          npx cap init "Apple Maps Clone" "com.apple.mapsclone" --web-dir "$WEB_DIR" || true
          npm install @capacitor/core @capacitor/android
          npx cap add android || true
          npx cap sync android || true

      - name: Build APK with Gradle
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
